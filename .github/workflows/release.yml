name: Build & Release YTGet

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag Name to Release'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
            deno_url: https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip

          - os: ubuntu-latest
            arch: x86_64
            deno_url: https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip

          - os: macos-latest
            arch: arm64
            deno_url: https://github.com/denoland/deno/releases/latest/download/deno-aarch64-apple-darwin.zip

          - os: macos-15
            arch: x86_64
            deno_url: https://github.com/denoland/deno/releases/latest/download/deno-x86_64-apple-darwin.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Deno
        shell: bash
        run: |
          echo "Downloading Deno from ${{ matrix.deno_url }}"
          curl -L "${{ matrix.deno_url }}" -o deno.zip

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -Command "Expand-Archive -Path deno.zip -DestinationPath deno_dir"
            cp deno_dir/deno.exe ./deno.exe
          else
            unzip deno.zip -d deno_dir
            cp deno_dir/deno ./deno
            chmod +x deno
          fi

      - name: Download yt-dlp
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o yt-dlp.exe
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o yt-dlp
            chmod +x yt-dlp
          fi

      - name: Download spotDL
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -L https://github.com/spotDL/spotify-downloader/releases/download/v4.5.2/spotdl-4.5.2-win32.exe -o spotdl.exe

      - name: Download ffmpeg & ffprobe
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            curl -L https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -o ffmpeg.zip
            powershell -Command "Expand-Archive -Path ffmpeg.zip -DestinationPath ."
            cp "$(powershell -Command "(Get-ChildItem -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName")" .
            cp "$(powershell -Command "(Get-ChildItem -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName")" .
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
            cp $(which ffmpeg) .
            cp $(which ffprobe) .
          else
            curl -L https://evermeet.cx/ffmpeg/ffmpeg-9.0.1.zip -o ffmpeg.zip
            unzip ffmpeg.zip
            chmod +x ffmpeg
            curl -L https://evermeet.cx/ffmpeg/ffprobe-9.0.1.zip -o ffprobe.zip
            unzip ffprobe.zip
            chmod +x ffprobe
          fi

      - name: Download PhantomJS
        shell: bash
        run: |
          WIN_URL="https://bitbucket.org/ariya/phantomjs/downloads/phantomjs-2.1.1-windows.zip"
          MAC_URL="https://bitbucket.org/ariya/phantomjs/downloads/phantomjs-2.1.1-macosx.zip"
          LINUX_URL="https://bitbucket.org/ariya/phantomjs/downloads/phantomjs-2.1.1-linux-x86_64.tar.bz2"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            curl -L "$WIN_URL" -o phantomjs.zip
            powershell -Command "Expand-Archive -Path phantomjs.zip -DestinationPath phantomjs_dir"
            cp phantomjs_dir/phantomjs-2.1.1-windows/bin/phantomjs.exe ./phantomjs.exe

          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            curl -L "$LINUX_URL" -o phantomjs.tar.bz2
            tar xjf phantomjs.tar.bz2
            cp phantomjs-2.1.1-linux-x86_64/bin/phantomjs ./phantomjs
            chmod +x phantomjs

          else
            curl -L "$MAC_URL" -o phantomjs.zip
            unzip phantomjs.zip
            cp phantomjs-2.1.1-macosx/bin/phantomjs ./phantomjs
            chmod +x phantomjs
          fi

      - name: Update Info.plist version (macOS only)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Info.plist

      - name: Build application
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ICON="ytget_gui/icon.icns"
            APP_NAME="YTGet"
            pyinstaller --noconfirm --onedir --windowed \
              --name "$APP_NAME" \
              --icon "$ICON" \
              --clean --noupx \
              --version-file "version_info.txt" \
              --osx-bundle-identifier "com.erfannamira.ytget" \
              --hidden-import "PySide6.*" \
              --hidden-import "requests" \
              --hidden-import "mutagen.*" \
              --hidden-import "PIL" \
              --add-data "ytget_gui:ytget_gui" \
              --add-data "ytget_gui/icon.icns:." \
              --add-data "ffmpeg:." \
              --add-data "ffprobe:." \
              --add-data "phantomjs:." \
              --add-data "deno:." \
              ytget_gui/main.py

            cp Info.plist "dist/$APP_NAME.app/Contents/Info.plist"

          else
            ICON="ytget_gui/icon.ico"

            # Only bundle spotdl on Windows
            SPOTDL_DATA=""
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              SPOTDL_DATA="--add-data spotdl.exe:."
            fi

            pyinstaller --noconfirm --onedir --windowed \
              --name "YTGet" \
              --icon "$ICON" \
              --clean --noupx \
              --version-file "version_info.txt" \
              --hidden-import "PySide6.*" \
              --hidden-import "requests" \
              --hidden-import "mutagen.*" \
              --hidden-import "PIL" \
              --add-data "ytget_gui:ytget_gui" \
              --add-data "ytget_gui/icon.ico:." \
              --add-data "yt-dlp${{ runner.os == 'Windows' && '.exe' || '' }}:." \
              --add-data "ffmpeg${{ runner.os == 'Windows' && '.exe' || '' }}:." \
              --add-data "ffprobe${{ runner.os == 'Windows' && '.exe' || '' }}:." \
              --add-data "phantomjs${{ runner.os == 'Windows' && '.exe' || '' }}:." \
              --add-data "deno${{ runner.os == 'Windows' && '.exe' || '' }}:." \
              $SPOTDL_DATA \
              ytget_gui/main.py
          fi

      - name: Smoke test (macOS only)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          EXEC="./dist/YTGet.app/Contents/MacOS/YTGet"
          if [ ! -f "$EXEC" ]; then
            echo "❌ $EXEC not found"; exit 1
          fi
          "$EXEC" --version

      - name: Package build
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell Compress-Archive -Path dist/YTGet -DestinationPath YTGet-windows.zip -CompressionLevel Optimal
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            tar czf YTGet-linux.tar.gz -C dist YTGet
          else
            cd dist
            if [[ "${{ matrix.arch }}" == "arm64" ]]; then
              tar czf YTGet-macOS-arm64.tar.gz YTGet.app
            else
              tar czf YTGet-macOS-x86_64.tar.gz YTGet.app
            fi
            cd ..
          fi

      - name: Package build (7z, max compression)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install p7zip
          fi

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cd dist
            7z a -t7z -mx=9 ../YTGet-windows.7z YTGet
            cd ..
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            cd dist
            7z a -t7z -mx=9 ../YTGet-linux.7z YTGet
            cd ..
          else
            cd dist
            if [[ "${{ matrix.arch }}" == "arm64" ]]; then
              7z a -t7z -mx=9 YTGet-macOS-arm64.7z YTGet.app
            else
              7z a -t7z -mx=9 YTGet-macOS-x86_64.7z YTGet.app
            fi
            cd ..
          fi

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          choco install innosetup --no-progress -y
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then
            echo "ISCC.exe not found at $ISCC"; exit 1
          fi

          # Inno Setup requires a numeric x.y.z[.b] version string, so strip a
          # leading "v" from the tag and fall back to the packaged version.
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            VERSION=$(python -c "import ytget_gui._version as v; print(v.__version__)")
          fi
          echo "Installer version: $VERSION"

          "$ISCC" //DAppVersion="$VERSION" "packaging/windows/ytget.iss"

          SETUP="YTGet-$VERSION-windows-setup.exe"
          if [ ! -f "$SETUP" ]; then
            echo "Installer was not produced"; ls -la; exit 1
          fi
          # Hand the exact filename to the later steps so the asset that
          # ships is the one RELEASE_NOTES.md links to.
          echo "SETUP_NAME=$SETUP" >> "$GITHUB_ENV"

      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "$env:SETUP_NAME"
          $item = Get-Item $setup
          Write-Host "Installer: $($item.Name) ($([math]::Round($item.Length / 1MB, 1)) MB)"
          if ($item.Length -lt 20MB) {
            throw "Installer looks truncated: $($item.Length) bytes"
          }

          # Cheap sanity check that the compiler produced a real PE binary.
          $head = [System.IO.File]::ReadAllBytes($item.FullName)[0..1]
          if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) {
            throw "Output is not a Windows executable"
          }

          # Real smoke test: install silently to a scratch folder, confirm the
          # app landed, then uninstall. Never run the wizard interactively and
          # never wait forever - a prompt would otherwise hang the whole job.
          $dir = Join-Path $env:RUNNER_TEMP "ytget-smoke"
          $log = Join-Path $env:RUNNER_TEMP "ytget-install.log"
          $installArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOICONS", "/DIR=$dir", "/LOG=$log")
          $proc = Start-Process -FilePath $item.FullName -ArgumentList $installArgs -PassThru
          if (-not $proc.WaitForExit(240000)) {
            $proc.Kill()
            throw "Installer did not finish within 4 minutes"
          }
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "Installer exited with code $($proc.ExitCode)"
          }

          $exe = Join-Path $dir "YTGet.exe"
          if (-not (Test-Path $exe)) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "YTGet.exe was not installed"
          }
          Write-Host "Installed OK: $exe"

          $uninstaller = Get-ChildItem -Path $dir -Filter "unins*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($uninstaller) {
            $un = Start-Process -FilePath $uninstaller.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -PassThru
            if (-not $un.WaitForExit(240000)) { $un.Kill() }
            Write-Host "Uninstaller ran (exit $($un.ExitCode))"
          } else {
            Write-Warning "No uninstaller found in $dir"
          }

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            certutil -hashfile YTGet-windows.zip SHA256 > YTGet-windows.sha256
            certutil -hashfile YTGet-windows.7z SHA256 > YTGet-windows-7z.sha256
            certutil -hashfile "$SETUP_NAME" SHA256 > YTGet-windows-setup.sha256
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            shasum -a 256 YTGet-linux.tar.gz > YTGet-linux.sha256
            shasum -a 256 YTGet-linux.7z > YTGet-linux-7z.sha256
          else
            if [[ "${{ matrix.arch }}" == "arm64" ]]; then
              shasum -a 256 dist/YTGet-macOS-arm64.tar.gz > dist/YTGet-macOS-arm64.sha256
              shasum -a 256 dist/YTGet-macOS-arm64.7z > dist/YTGet-macOS-arm64-7z.sha256
            else
              shasum -a 256 dist/YTGet-macOS-x86_64.tar.gz > dist/YTGet-macOS-x86_64.sha256
              shasum -a 256 dist/YTGet-macOS-x86_64.7z > dist/YTGet-macOS-x86_64-7z.sha256
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            YTGet-*.*
            dist/YTGet-*.tar.gz
            dist/YTGet-*.7z
            dist/YTGet-*.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "${{ github.event.inputs.tag || github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
