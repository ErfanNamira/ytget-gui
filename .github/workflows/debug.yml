name: Build YTGet (Windows Debug)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (windows-latest - x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Deno
        shell: bash
        run: |
          curl -L "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -o deno.zip
          powershell -Command "Expand-Archive -Path deno.zip -DestinationPath deno_dir"
          cp deno_dir/deno.exe ./deno.exe

      - name: Download yt-dlp
        shell: bash
        run: |
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o yt-dlp.exe

      - name: Download spotDL
        shell: bash
        run: |
          curl -L https://github.com/spotDL/spotify-downloader/releases/download/v4.5.0/spotdl-4.5.0-win32.exe -o spotdl.exe

      - name: Download ffmpeg & ffprobe
        shell: bash
        run: |
          curl -L https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -o ffmpeg.zip
          powershell -Command "Expand-Archive -Path ffmpeg.zip -DestinationPath ."
          cp "$(powershell -Command "(Get-ChildItem -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName")" .
          cp "$(powershell -Command "(Get-ChildItem -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName")" .

      - name: Download PhantomJS
        shell: bash
        run: |
          curl -L "https://bitbucket.org/ariya/phantomjs/downloads/phantomjs-2.1.1-windows.zip" -o phantomjs.zip
          powershell -Command "Expand-Archive -Path phantomjs.zip -DestinationPath phantomjs_dir"
          cp phantomjs_dir/phantomjs-2.1.1-windows/bin/phantomjs.exe ./phantomjs.exe

      - name: Build application
        shell: bash
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "YTGet" \
            --icon "ytget_gui/icon.ico" \
            --clean --noupx \
            --version-file "version_info.txt" \
            --hidden-import "PySide6.*" \
            --hidden-import "requests" \
            --hidden-import "mutagen.*" \
            --hidden-import "PIL" \
            --add-data "ytget_gui:ytget_gui" \
            --add-data "ytget_gui/icon.ico:." \
            --add-data "yt-dlp.exe:." \
            --add-data "ffmpeg.exe:." \
            --add-data "ffprobe.exe:." \
            --add-data "phantomjs.exe:." \
            --add-data "deno.exe:." \
            --add-data "spotdl.exe:." \
            ytget_gui/main.py

      - name: Package build (7z, max compression)
        shell: bash
        run: |
          cd dist
          7z a -t7z -mx=9 ../YTGet-windows.7z YTGet
          cd ..

      - name: Build Windows installer
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          choco install innosetup --no-progress -y
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then
            echo "ISCC.exe not found at $ISCC"; exit 1
          fi

          VERSION=$(python -c "import ytget_gui._version as v; print(v.__version__)")
          echo "Installer version: $VERSION"
          "$ISCC" //DAppVersion="$VERSION" "packaging/windows/ytget.iss"

          SETUP="YTGet-$VERSION-windows-setup.exe"
          if [ ! -f "$SETUP" ]; then
            echo "Installer was not produced"; ls -la; exit 1
          fi
          cp "$SETUP" YTGet-windows-setup.exe
          echo "SETUP_FILE=YTGet-windows-setup.exe" >> "$GITHUB_ENV"

      - name: Verify Windows installer
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "$env:SETUP_FILE"
          $item = Get-Item $setup
          Write-Host "Installer: $($item.Name) ($([math]::Round($item.Length / 1MB, 1)) MB)"
          if ($item.Length -lt 20MB) {
            throw "Installer looks truncated: $($item.Length) bytes"
          }

          # Cheap sanity check that the compiler produced a real PE binary.
          $head = [System.IO.File]::ReadAllBytes($item.FullName)[0..1]
          if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) {
            throw "Output is not a Windows executable"
          }

          # Real smoke test: install silently to a scratch folder, confirm the
          # app landed, then uninstall. Never run the wizard interactively and
          # never wait forever - a prompt would otherwise hang the whole job.
          $dir = Join-Path $env:RUNNER_TEMP "ytget-smoke"
          $log = Join-Path $env:RUNNER_TEMP "ytget-install.log"
          $args = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOICONS", "/DIR=$dir", "/LOG=$log")
          $proc = Start-Process -FilePath $item.FullName -ArgumentList $args -PassThru
          if (-not $proc.WaitForExit(240000)) {
            $proc.Kill()
            throw "Installer did not finish within 4 minutes"
          }
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "Installer exited with code $($proc.ExitCode)"
          }

          $exe = Join-Path $dir "YTGet.exe"
          if (-not (Test-Path $exe)) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "YTGet.exe was not installed"
          }
          Write-Host "Installed OK: $exe"

          $uninstaller = Get-ChildItem -Path $dir -Filter "unins*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($uninstaller) {
            $un = Start-Process -FilePath $uninstaller.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -PassThru
            if (-not $un.WaitForExit(240000)) { $un.Kill() }
            Write-Host "Uninstaller ran (exit $($un.ExitCode))"
          } else {
            Write-Warning "No uninstaller found in $dir"
          }

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          certutil -hashfile YTGet-windows.7z SHA256 > YTGet-windows-7z.sha256
          certutil -hashfile YTGet-windows-setup.exe SHA256 > YTGet-windows-setup.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: YTGet-windows-test
          path: |
            YTGet-windows.7z
            YTGet-windows-7z.sha256
            YTGet-windows-setup.exe
            YTGet-windows-setup.sha256
