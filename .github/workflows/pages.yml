name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on for the repository if it is not enabled yet,
          # so the first run does not fail with "Get Pages site failed".
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          # Default is 1 day: if the deploy step fails and you re-run only
          # the failed job the next day, the artifact is already expired
          # and deploy-pages reports "No artifacts named github-pages".
          retention-days: 5

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
